services:
  pikpak-nas:
    build: .
    image: pikpak-nas-ui:local
    container_name: pikpak-nas
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8088"
      APP_USER: admin
      APP_PASSWORD: "CHANGE_ME"
      DOWNLOAD_UID: "0"
      DOWNLOAD_GID: "0"
      MAX_CONCURRENT: "2"
      TZ: Asia/Shanghai
    volumes:
      - ./runtime/config:/config
      - ./runtime/downloads:/downloads
